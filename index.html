<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Xtreme Voice AI | Text to Audio</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: #ffffff;
      min-height: 100vh;
    }

    header {
      width: 100%;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(11,16,32,0.95);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
    }

    .logo span {
      color: #7c5cff;
    }

    .badge {
      font-size: 13px;
      padding: 8px 14px;
      border-radius: 20px;
      background: rgba(124,92,255,0.15);
      color: #b8a9ff;
    }

    .container {
      width: 90%;
      max-width: 900px;
      margin: 50px auto;
    }

    .hero {
      text-align: center;
      margin-bottom: 35px;
    }

    .hero h1 {
      font-size: clamp(34px, 7vw, 58px);
      margin-bottom: 14px;
    }

    .hero h1 span {
      color: #8b6cff;
    }

    .hero p {
      color: #aab1c5;
      font-size: 17px;
      line-height: 1.6;
    }

    .card {
      background: #131a2e;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      padding: 25px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #cbd1df;
      font-weight: 600;
    }

    textarea {
      width: 100%;
      min-height: 190px;
      resize: vertical;
      border: 1px solid #2d3650;
      border-radius: 15px;
      background: #0d1324;
      color: #ffffff;
      padding: 16px;
      font-size: 16px;
      line-height: 1.6;
      outline: none;
    }

    textarea:focus {
      border-color: #7c5cff;
    }

    .counter {
      text-align: right;
      color: #7f89a3;
      font-size: 12px;
      margin-top: 6px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 20px;
    }

    select {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #2d3650;
      background: #0d1324;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }

    .generate-btn {
      width: 100%;
      margin-top: 22px;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #7c5cff, #5c8dff);
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .generate-btn:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }

    .generate-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      display: none;
      text-align: center;
      margin-top: 18px;
      color: #aeb7ca;
      font-size: 14px;
    }

    .loader {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #8b6cff;
      border-radius: 50%;
      display: inline-block;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .result {
      display: none;
      margin-top: 25px;
      padding: 20px;
      border-radius: 17px;
      background: #0d1324;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .result h3 {
      margin-bottom: 15px;
      font-size: 17px;
    }

    audio {
      width: 100%;
      margin-bottom: 15px;
    }

    .download {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 10px;
      background: #222c46;
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
    }

    .error {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      background: rgba(255,70,70,0.1);
      border: 1px solid rgba(255,70,70,0.3);
      color: #ff9b9b;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 35px 20px;
      color: #68728a;
      font-size: 13px;
    }

    @media (max-width: 650px) {
      .controls {
        grid-template-columns: 1fr;
      }

      .container {
        margin-top: 30px;
      }

      .card {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    Xtreme <span>Voice AI</span>
  </div>

  <div class="badge">
    Hindi TTS
  </div>
</header>

<main class="container">

  <section class="hero">
    <h1>Text to <span>Audio</span></h1>

    <p>
      अपना Hindi text लिखें और AI से natural speech generate करें।
    </p>
  </section>

  <section class="card">

    <label for="textInput">
      अपना Text लिखें
    </label>

    <textarea
      id="textInput"
      maxlength="5000"
      placeholder="यहाँ अपना हिंदी text लिखें..."
    ></textarea>

    <div class="counter">
      <span id="counter">0</span> / 5000
    </div>

    <div class="controls">

      <div>
        <label for="language">
          Language
        </label>

        <select id="language">
          <option value="hi">Hindi</option>
        </select>
      </div>

      <div>
        <label for="voice">
          Voice
        </label>

        <select id="voice">
          <option value="af_heart">
            Hindi AI Voice
          </option>
        </select>
      </div>

    </div>

    <button
      class="generate-btn"
      id="generateBtn"
      onclick="generateVoice()"
    >
      🎙️ Generate Voice
    </button>

    <div class="status" id="status">
      <span class="loader"></span>
      Voice generate हो रही है...
    </div>

    <div class="error" id="error"></div>

    <div class="result" id="result">

      <h3>🔊 Your Generated Audio</h3>

      <audio
        id="audioPlayer"
        controls
      ></audio>

      <a
        id="downloadBtn"
        class="download"
        download="xtreme-voice.wav"
      >
        ⬇️ Download Audio
      </a>

    </div>

  </section>

</main>

<footer>
  © 2026 Xtreme AG Apps · Xtreme Voice AI
</footer>


<script>

  /*
   * Xtreme Voice AI
   * Temporary TTS API
   */
  const API_URL =
    "https://tap-sign-description-podcasts.trycloudflare.com/generate";


  const textInput = document.getElementById("textInput");
  const counter = document.getElementById("counter");

  const generateBtn =
    document.getElementById("generateBtn");

  const statusBox =
    document.getElementById("status");

  const resultBox =
    document.getElementById("result");

  const errorBox =
    document.getElementById("error");

  const audioPlayer =
    document.getElementById("audioPlayer");

  const downloadBtn =
    document.getElementById("downloadBtn");


  /*
   * Character counter
   */
  textInput.addEventListener("input", function () {

    counter.textContent =
      textInput.value.length;

  });


  /*
   * Generate Voice
   */
  async function generateVoice() {

    const text =
      textInput.value.trim();

    /*
     * Clear old state
     */
    errorBox.style.display = "none";
    resultBox.style.display = "none";
    statusBox.style.display = "none";

    /*
     * Validation
     */
    if (!text) {

      showError(
        "कृपया पहले text लिखें।"
      );

      return;
    }

    if (text.length > 5000) {

      showError(
        "Maximum 5000 characters allowed हैं।"
      );

      return;
    }


    /*
     * Loading
     */
    generateBtn.disabled = true;
    statusBox.style.display = "block";


    try {

      const response =
        await fetch(API_URL, {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({

            text: text,

            voice: "af_heart"

          })

        });


      /*
       * API error
       */
      if (!response.ok) {

        let message =
          "Voice generation failed.";

        try {

          const data =
            await response.json();

          if (data.detail) {
            message = data.detail;
          }

        } catch (e) {}

        throw new Error(message);
      }


      /*
       * Get WAV file
       */
      const audioBlob =
        await response.blob();


      if (!audioBlob.size) {

        throw new Error(
          "Empty audio received."
        );

      }


      /*
       * Create browser audio URL
       */
      const audioUrl =
        URL.createObjectURL(audioBlob);


      audioPlayer.src =
        audioUrl;


      downloadBtn.href =
        audioUrl;


      /*
       * Show result
       */
      resultBox.style.display =
        "block";


      /*
       * Scroll to result
       */
      resultBox.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });


    } catch (error) {

      console.error(
        "TTS Error:",
        error
      );

      showError(
        "Voice generate नहीं हो पाई। " +
        error.message
      );

    } finally {

      generateBtn.disabled =
        false;

      statusBox.style.display =
        "none";

    }

  }


  /*
   * Error helper
   */
  function showError(message) {

    errorBox.textContent =
      "⚠️ " + message;

    errorBox.style.display =
      "block";

  }

</script>

</body>
</html>
