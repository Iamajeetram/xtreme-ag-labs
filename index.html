<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Xtreme Voice AI | Xtreme AG Labs</title>

<style>
:root{
    --bg:#07070a;
    --panel:#111218;
    --panel2:#171821;
    --border:#ffffff18;
    --text:#ffffff;
    --muted:#a7a9b5;
    --accent:#9b8cff;
    --accent2:#6f5cff;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:
        radial-gradient(circle at 15% 5%,rgba(155,140,255,.20),transparent 30%),
        radial-gradient(circle at 85% 20%,rgba(90,70,255,.12),transparent 30%),
        var(--bg);
    color:var(--text);
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    min-height:100vh;
}

a{
    color:inherit;
    text-decoration:none;
}

header{
    position:sticky;
    top:0;
    z-index:10;
    background:#07070acc;
    backdrop-filter:blur(18px);
    border-bottom:1px solid var(--border);
}

.nav{
    width:min(1160px,92%);
    height:70px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.brand{
    font-weight:800;
    letter-spacing:-.02em;
}

.brand span{
    color:var(--accent);
}

nav{
    display:flex;
    gap:22px;
    font-size:14px;
    color:var(--muted);
}

nav a:hover{
    color:white;
}

main{
    width:min(900px,92%);
    margin:auto;
}

.hero{
    text-align:center;
    padding:70px 0 35px;
}

.badge{
    display:inline-block;
    padding:7px 13px;
    border:1px solid #9b8cff55;
    border-radius:999px;
    color:var(--accent);
    font-size:12px;
    font-weight:700;
    letter-spacing:.08em;
}

h1{
    font-size:clamp(42px,8vw,76px);
    line-height:1;
    letter-spacing:-.055em;
    margin:22px 0 15px;
}

h1 span{
    color:var(--accent);
}

.subtitle{
    color:var(--muted);
    font-size:17px;
    line-height:1.6;
}

.workspace{
    background:linear-gradient(145deg,#ffffff0d,#ffffff04);
    border:1px solid var(--border);
    border-radius:26px;
    padding:22px;
    box-shadow:0 25px 80px #00000040;
}

label{
    display:block;
    color:#d9d9df;
    font-size:13px;
    font-weight:700;
    margin-bottom:9px;
}

textarea{
    width:100%;
    min-height:230px;
    resize:vertical;
    border:1px solid var(--border);
    border-radius:18px;
    background:#090a0e;
    color:white;
    padding:18px;
    font-size:16px;
    line-height:1.6;
    outline:none;
}

textarea:focus{
    border-color:#9b8cff77;
    box-shadow:0 0 0 3px #9b8cff12;
}

.counter{
    text-align:right;
    color:#777b88;
    font-size:12px;
    margin-top:7px;
}

.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-top:20px;
}

select{
    width:100%;
    padding:14px;
    border-radius:13px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:white;
    outline:none;
}

.generate{
    width:100%;
    margin-top:20px;
    padding:16px;
    border:0;
    border-radius:15px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:white;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
}

.generate:hover{
    filter:brightness(1.1);
}

.generate:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.result{
    display:none;
    margin-top:20px;
    padding:18px;
    border:1px solid var(--border);
    border-radius:18px;
    background:#090a0e;
}

.result-title{
    font-weight:700;
    margin-bottom:12px;
}

audio{
    width:100%;
}

.download{
    display:inline-block;
    margin-top:12px;
    padding:10px 15px;
    border-radius:10px;
    background:#ffffff10;
    border:1px solid var(--border);
    font-size:13px;
}

.note{
    text-align:center;
    color:#777b88;
    font-size:12px;
    padding:28px 0 50px;
}

footer{
    border-top:1px solid var(--border);
    color:#777b88;
    font-size:12px;
    padding:25px 0;
    text-align:center;
}

@media(max-width:650px){

    nav{
        gap:12px;
        font-size:12px;
    }

    nav a:nth-child(2){
        display:none;
    }

    .hero{
        padding-top:50px;
    }

    .workspace{
        padding:15px;
        border-radius:20px;
    }

    .options{
        grid-template-columns:1fr;
    }

    textarea{
        min-height:200px;
    }
}
</style>
</head>

<body>

<header>
    <div class="nav">

        <a class="brand" href="./">
            XTREME <span>AG APPS</span>
        </a>

        <nav>
            <a href="./">Labs</a>
            <a href="./">Projects</a>
            <a href="https://xtremeagapps.in/">Main Site</a>
        </nav>

    </div>
</header>


<main>

<section class="hero">

    <div class="badge">
        XAG LABS
    </div>

    <h1>
        Xtreme <span>Voice AI</span>
    </h1>

    <p class="subtitle">
        Turn your text into natural sounding AI speech.
        Fast, simple and built by Xtreme AG Apps.
    </p>

</section>


<section class="workspace">

    <label for="text">
        Enter your text
    </label>

    <textarea
        id="text"
        maxlength="5000"
        placeholder="Type or paste your text here..."
    ></textarea>

    <div class="counter">
        <span id="count">0</span> / 5000 characters
    </div>


    <div class="options">

        <div>
            <label for="language">
                Language
            </label>

            <select id="language">
                <option value="hi">Hindi</option>
                <option value="en">English</option>
            </select>
        </div>


        <div>
            <label for="voice">
                Voice
            </label>

            <select id="voice">

                <option>
                    Hindi Male
                </option>

                <option>
                    Hindi Female
                </option>

                <option>
                    English Male
                </option>

                <option>
                    English Female
                </option>

            </select>

        </div>

    </div>


    <button
        class="generate"
        id="generate"
        onclick="generateVoice()"
    >
        Generate Voice
    </button>


    <div class="result" id="result">

        <div class="result-title">
            Generated Audio
        </div>

        <audio id="audio" controls></audio>

        <br>

        <a
            id="download"
            class="download"
            download="xtreme-voice.mp3"
        >
            Download Audio
        </a>

    </div>

</section>


<div class="note">
    Xtreme Voice AI · Xtreme AG Labs
</div>

</main>


<footer>
    © 2026 Xtreme AG Apps · labs.xtremeagapps.in
</footer>


<script>

const textBox = document.getElementById("text");
const count = document.getElementById("count");

textBox.addEventListener("input", () => {
    count.textContent = textBox.value.length;
});


async function generateVoice(){

    const text = textBox.value.trim();
    const button = document.getElementById("generate");

    if(!text){

        alert("Please enter some text first.");

        return;
    }

    button.disabled = true;
    button.textContent = "Generating...";

    /*
       TTS API will be connected here.
       For now this is only the frontend.
    */

    setTimeout(() => {

        button.disabled = false;
        button.textContent = "Generate Voice";

        alert(
            "Text to Audio engine will be connected in the next step."
        );

    },1000);
}

</script>

</body>
</html>
